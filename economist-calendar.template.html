<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中级经济师 · 备考日历</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#2b2b2b; --sub:#6b6b6b; --line:#e7e2d8;
    --blue:#2f6fed; --orange:#ef8a17; --red:#e5484d; --purple:#8b5cf6; --gray:#9aa0a6; --green:#34c759;
    --shadow:0 2px 10px rgba(60,50,30,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.55}
  .wrap{max-width:940px;margin:0 auto;padding:14px 14px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
  header.top h1{font-size:20px;margin:0;font-weight:700}
  .storage{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub)}
  .storage.db{color:var(--green);border-color:#bfe9cd}
  .storage.local{color:var(--orange);border-color:#f3d9b0}
  /* tabs */
  .tabs{display:flex;gap:6px;background:#ece7dc;border-radius:14px;padding:5px;margin-bottom:14px}
  .tabs button{flex:1;border:none;background:transparent;border-radius:10px;padding:10px 6px;font-size:15px;font-weight:600;color:var(--sub);cursor:pointer;transition:.15s}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .tabpane{display:none}
  .tabpane.on{display:block}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .month-nav{display:flex;align-items:center;gap:6px}
  .month-nav button{width:34px;height:34px;border:none;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
  .month-label{font-weight:700;min-width:96px;text-align:center}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
  .filters button.on{color:#fff;border-color:transparent}
  .filters button.on[data-p="all"]{background:#555}
  .filters button.on[data-p="入门精讲"]{background:var(--blue)}
  .filters button.on[data-p="强化刷题"]{background:var(--orange)}
  .filters button.on[data-p="冲刺模考"]{background:var(--red)}
  .jump{margin-left:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
  .stat-bar{background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:14px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .stat-bar b{color:var(--ink)}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;color:#fff;font-weight:600}
  .b-blue{background:var(--blue)}.b-orange{background:var(--orange)}.b-red{background:var(--red)}.b-purple{background:var(--purple)}.b-gray{background:var(--gray)}.b-green{background:var(--green)}
  /* today */
  .today-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px}
  .today-head .date{font-size:22px;font-weight:700}
  .today-head .wd{color:var(--sub);font-size:14px}
  .today-head .meta{margin-left:auto;color:var(--sub);font-size:13px}
  .progress{height:10px;background:#eee;border-radius:999px;overflow:hidden;margin:10px 0}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5fd98a);width:0;transition:width .3s}
  .pct{font-size:13px;color:var(--sub);text-align:right;margin-bottom:8px}
  ul.tasks{list-style:none;margin:0;padding:0}
  ul.tasks li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
  ul.tasks li:last-child{border-bottom:none}
  .chk{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:2px solid #cfc8ba;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:2px}
  .chk.done{background:var(--green);border-color:var(--green)}
  .task-txt{flex:1}
  .task-txt.done{color:var(--gray);text-decoration:line-through}
  .empty{color:var(--sub);font-size:14px;padding:8px 0}
  /* week */
  .week-goal{font-size:14px;color:var(--sub);margin:6px 0 10px}
  .week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .wd-cell{background:#faf8f3;border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;position:relative}
  .wd-cell .d{font-weight:700}
  .wd-cell .mini{height:5px;border-radius:999px;background:#e3ddd0;margin-top:5px;overflow:hidden}
  .wd-cell .mini > i{display:block;height:100%;background:var(--green)}
  .wd-cell.today{outline:2px solid var(--blue)}
  .wd-cell .ph{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%}
  /* calendar */
  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .cal-head span{text-align:center;font-size:13px;color:var(--sub);font-weight:600}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cell{background:var(--card);border-radius:12px;min-height:62px;padding:6px 4px 4px;position:relative;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;transition:transform .1s}
  .cell:hover{transform:translateY(-2px)}
  .cell.blank{background:#f7f4ee;box-shadow:none;cursor:default;border:1px dashed #e3ddd0}
  .cell.blank:hover{transform:none}
  .cell.blank .num{color:#cfc8ba;font-weight:400}
  .cell .num{font-size:13px;font-weight:600;color:var(--ink)}
  .cell .dot{width:9px;height:9px;border-radius:50%;margin-top:5px}
  .cell.today{border:2px solid var(--blue)}
  .cell.done .num::after{content:"✓";color:var(--green);font-size:11px;margin-left:3px}
  .cell.dim{opacity:.32}
  .cell .rest{font-size:11px;color:var(--gray);margin-top:4px}
  /* legend */
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin:6px 2px 0}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(30,25,15,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal .mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .modal .mhead .date{font-size:20px;font-weight:700}
  .modal .mrow{font-size:13px;color:var(--sub);margin:3px 0}
  .modal .mrow b{color:var(--ink)}
  .modal .close{margin-left:auto;border:none;background:#f0ece3;border-radius:10px;width:32px;height:32px;font-size:18px;cursor:pointer}
  .modal hr{border:none;border-top:1px dashed var(--line);margin:12px 0}

  /* quiz / review */
  .q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .q-subject{font-size:13px;color:var(--sub)}
  .q-body{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:14px}
  .opts{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
  .opts li{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.12s}
  .opts li:hover{border-color:#cfc8ba}
  .opts li.sel{border-color:var(--blue);background:#f0f5ff}
  .opts li.correct{border-color:var(--green);background:#effaf1}
  .opts li.wrong{border-color:var(--red);background:#fdeeef}
  .opts .mark{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid #cfc8ba;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
  .opts li.sel .mark{border-color:var(--blue);color:var(--blue)}
  .opts li.correct .mark{border-color:var(--green);color:var(--green)}
  .opts li.wrong .mark{border-color:var(--red);color:var(--red)}
  .opts .txt{flex:1}
  .q-explain{background:#faf8f3;border-radius:12px;padding:12px;font-size:14px;color:var(--sub);margin-bottom:12px;display:none}
  .q-explain.show{display:block}
  .q-explain b{color:var(--ink)}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--blue);box-shadow:var(--shadow)}
  .btn.ghost{background:#fff;color:var(--sub);border:1px solid var(--line);box-shadow:none}
  .btn.green{background:var(--green)}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .q-result{font-size:15px;font-weight:700;margin-bottom:10px;display:none}
  .q-result.show{display:block}
  .q-result.ok{color:var(--green)} .q-result.no{color:var(--red)}
  .review-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .review-filters select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:#fff;color:var(--ink)}
  .review-stat{font-size:13px;color:var(--sub);margin-bottom:12px}
  .review-stat b{color:var(--ink)}
  .hist-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .hist-item:last-child{border-bottom:none}
  .hist-item .ok{color:var(--green);font-weight:700}
  .hist-item .no{color:var(--red);font-weight:700}
  .hist-item .qtext{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score-banner{background:linear-gradient(90deg,var(--blue),#5b8def);color:#fff;border-radius:14px;padding:16px;text-align:center;margin-bottom:14px}
  .score-banner .big{font-size:30px;font-weight:800}
  @media (max-width:600px){
    body{font-size:15px}
    .wrap{padding:10px 10px 50px}
    header.top h1{font-size:18px}
    .cell{min-height:52px}
    .cell .num{font-size:12px}
    .today-head .date{font-size:19px}
    .filters button{padding:4px 9px;font-size:12px}
    .tabs button{font-size:13px;padding:9px 4px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>📚 中级经济师 · 备考日历</h1>
    <span id="storage" class="storage">存储：检测中…</span>
  </header>

  <div class="tabs">
    <button data-tab="cal" class="on">🗓 学习日历</button>
    <button data-tab="quiz">✍️ 每日一练</button>
    <button data-tab="review">📖 题库回顾</button>
    <button data-tab="wrong">📕 错题本</button>
  </div>

  <!-- ============ 学习日历 ============ -->
  <div class="tabpane on" id="pane-cal">
    <div class="toolbar">
      <div class="month-nav">
        <button id="prevM">‹</button>
        <span class="month-label" id="monthLabel">—</span>
        <button id="nextM">›</button>
      </div>
      <div class="filters" id="filters">
        <button data-p="all" class="on">全部</button>
        <button data-p="入门精讲">入门精讲</button>
        <button data-p="强化刷题">强化刷题</button>
        <button data-p="冲刺模考">冲刺模考</button>
      </div>
      <button class="jump" id="jumpWeek">⤴ 跳到本周</button>
    </div>

    <div class="stat-bar">
      <span>备考窗口 <b id="rangeTxt">—</b>　·　共 <b id="totalDays">—</b> 天</span>
      <span>总进度 <b id="overallTxt">—</b></span>
    </div>

    <div class="card" id="todayCard"></div>
    <div class="card" id="weekCard"></div>

    <div class="card">
      <h2>🗓 学习日历</h2>
      <div class="cal-head">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal" id="cal"></div>
      <div class="legend">
        <span><i style="background:var(--blue)"></i>入门精讲</span>
        <span><i style="background:var(--orange)"></i>强化刷题</span>
        <span><i style="background:var(--red)"></i>冲刺模考</span>
        <span><i style="background:var(--purple)"></i>考试日</span>
        <span><i style="background:var(--gray)"></i>休息日</span>
      </div>
    </div>
  </div>

  <!-- ============ 每日一练 ============ -->
  <div class="tabpane" id="pane-quiz">
    <div class="card" id="dailyQuiz"></div>
  </div>

  <!-- ============ 题库回顾 ============ -->
  <div class="tabpane" id="pane-review">
    <div class="card">
      <h2>📖 题库回顾 <span class="badge b-purple">练过的题都在这里</span></h2>
      <div class="review-filters">
        <select id="revPhase"><option value="all">全部阶段</option><option value="入门精讲">入门精讲</option><option value="强化刷题">强化刷题</option><option value="冲刺模考">冲刺模考</option></select>
        <select id="revSubject"><option value="all">全部科目</option></select>
        <button class="btn" id="revStart">🎯 开始练习 5 道</button>
        <button class="btn ghost" id="revReset">重置筛选</button>
      </div>
      <div class="review-stat" id="revStat"></div>
      <div id="reviewArea"></div>
    </div>
    <div class="card">
      <h2>📝 我的答题历史</h2>
      <div id="histArea"><div class="empty">还没有答题记录，去「每日一练」或「开始练习」做几道吧。</div></div>
    </div>
  </div>

  <!-- ============ 错题本 ============ -->
  <div class="tabpane" id="pane-wrong">
    <div class="card">
      <h2>📕 错题本 <span class="badge b-red" id="wrongCount">0 道待攻克</span></h2>
      <div class="btn-row" style="margin-bottom:12px">
        <button class="btn" id="wrongStart">🎯 专攻错题（优先录入）</button>
        <button class="btn ghost" id="wrongClear">清空错题本</button>
      </div>
      <div id="wrongArea"><div class="empty">还没有错题。做错的题会自动收集到这里，方便你反复回顾。</div></div>
    </div>
  </div>
</div>

<!-- 当日详情弹窗 -->
<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script>
const PLAN = ___PLAN_JSON___;
const QUESTIONS = ___QUESTIONS_JSON___;

/* ---------- 基础数据 ---------- */
const byDate = {}; const byDay = {};
PLAN.days.forEach(d => { byDate[d.date] = d; byDay[d.day] = d; });
const Q = QUESTIONS.questions;
const QBYID = {}; Q.forEach(q => QBYID[q.id] = q);
const SUBJECTS = [...new Set(Q.map(q => q.subject))];

const PHASE_COLOR = {'入门精讲':'var(--blue)','强化刷题':'var(--orange)','冲刺模考':'var(--red)'};
function phaseColor(rec){
  if(rec.type==='考试') return 'var(--purple)';
  if(rec.type==='休息') return 'var(--gray)';
  return PHASE_COLOR[rec.phase]||'var(--gray)';
}
function phaseClass(rec){
  if(rec.type==='考试') return 'b-purple';
  if(rec.type==='休息') return 'b-gray';
  if(rec.phase==='入门精讲') return 'b-blue';
  if(rec.phase==='强化刷题') return 'b-orange';
  if(rec.phase==='冲刺模考') return 'b-red';
  return 'b-gray';
}

/* ---------- 日期工具 ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const p=s.split('-'); return {y:+p[0],m:+p[1],d:+p[2]}; }

/* ---------- 状态 ---------- */
let checkins = {};        // 'day:idx' -> 1
let quizRecords = {};     // qid -> 1(对)/0(错)
let storageMode = 'local';
let filterPhase = 'all';
let view = parseDate(todayStr());

/* ---------- 打卡读写 ---------- */
async function loadData(){
  // 打卡
  try{
    const r = await fetch('/api/econ-checkins', {cache:'no-store'});
    if(!r.ok) throw 0; const j = await r.json(); if(!j.ok) throw 0;
    const m = {}; (j.rows||[]).forEach(x => { if(x.checked) m[x.day+':'+x.task_idx]=1; });
    checkins = m; storageMode='db';
  }catch(e){ try{ checkins=JSON.parse(localStorage.getItem('econ_checkins_v1')||'{}')||{}; }catch(_){ checkins={}; } storageMode='local'; }
  // 答题
  try{
    const r = await fetch('/api/econ-quiz-records', {cache:'no-store'});
    if(!r.ok) throw 0; const j = await r.json(); if(!j.ok) throw 0;
    const m = {}; (j.rows||[]).forEach(x => { m[x.qid] = x.correct?1:0; });
    quizRecords = m;
  }catch(e){ try{ quizRecords=JSON.parse(localStorage.getItem('econ_quiz_v1')||'{}')||{}; }catch(_){ quizRecords={}; } }
}
function isDone(rec,i){ return !!checkins[rec.day+':'+i]; }
async function toggle(rec,i,val){
  const was = isDone(rec,i);
  if(val) checkins[rec.day+':'+i]=1; else delete checkins[rec.day+':'+i];
  localStorage.setItem('econ_checkins_v1', JSON.stringify(checkins));
  if(storageMode==='db'){
    try{ const r=await fetch('/api/econ-checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({day:rec.day,task_idx:i,checked:val?1:0})}); const j=await r.json(); if(!j.ok) throw 0; }
    catch(e){ storageMode='local'; updateStorageBadge(); }
  }
  // 愿力发放：仅在完成状态变化时（完成 +wp，取消 -wp）；视频时长任务按 eachWp，其余每任务 10
  if(val !== was){
    const wp = (rec.eachWp && rec.eachWp[i]) || 10;
    econGrantWP(val?wp:-wp, '经济师·学习日历', 'Day'+rec.day+' '+(rec.tasks[i]||'').slice(0,12));
  }
  renderToday(); renderWeek(); renderCalendar();
}
async function saveQuiz(qid, correct){
  const old = quizRecords[qid];
  quizRecords[qid] = correct?1:0;
  localStorage.setItem('econ_quiz_v1', JSON.stringify(quizRecords));
  if(storageMode==='db'){
    try{ await fetch('/api/econ-quiz-answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qid,correct:correct?1:0})}); }
    catch(e){ /* 离线忽略 */ }
  }
  renderHist();
  return old;
}

/* ---------- 愿力发放（postMessage 给父页游戏人生） ---------- */
function econDayKey(){ return todayStr(); }
function econDailyCount(k){ try{ return Number(localStorage.getItem(k)||'0'); }catch(e){ return 0; } }
function econDailyInc(k){ try{ localStorage.setItem(k, String(econDailyCount(k)+1)); }catch(e){} }
function econGrantWP(delta, source, text){
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'econ-wp', delta:delta, source:source, text:text}, location.origin); } }catch(e){}
}
function econConquerWrong(correct){     // 原错题做对 → 攻克 +1，每日封顶 3 道
  if(correct!==true) return;
  const dk='econ_wb_'+econDayKey();
  if(econDailyCount(dk) < 3){ econDailyInc(dk); econGrantWP(1,'经济师·错题本','攻克错题'); }
}

/* ---------- 进度 ---------- */
function dayDone(rec){ let n=0; rec.tasks.forEach((_,i)=>{ if(isDone(rec,i)) n++; }); return n; }
function dayTotal(rec){ return rec.tasks.length; }
function weekDays(num){ return PLAN.days.filter(d=>d.week===num); }
function weekDone(num){ let n=0,t=0; weekDays(num).forEach(r=>{ t+=dayTotal(r); n+=dayDone(r); }); return {done:n,total:t}; }

function updateStorageBadge(){
  const el=document.getElementById('storage');
  if(storageMode==='db'){ el.textContent='存储：数据库 ✓'; el.className='storage db'; }
  else { el.textContent='存储：本地（离线）'; el.className='storage local'; }
}

/* ---------- 今日卡片 ---------- */
function renderToday(){
  const el=document.getElementById('todayCard');
  const t=todayStr(); const rec=byDate[t];
  let html='<h2>🌟 今日任务 <span class="badge '+(rec?phaseClass(rec):'b-gray')+'">'+(rec?rec.phase:'—')+'</span></h2>';
  if(!rec){ html+='<div class="empty">今天（'+t+'）不在备考窗口（'+PLAN.startDate+' ~ '+PLAN.endDate+'）内，暂无计划任务。</div>'; el.innerHTML=html; return; }
  const done=dayDone(rec), total=dayTotal(rec), pct=total?Math.round(done/total*100):0;
  html+='<div class="today-head"><span class="date">'+rec.date+'</span><span class="wd">'+rec.weekday+'</span>'
      +'<span class="meta">'+rec.week+'　·　'+rec.subject+'　·　'+rec.duration+'</span></div>';
  html+=renderTaskList(rec);
  html+='<div class="progress"><i style="width:'+pct+'%"></i></div><div class="pct">已完成 '+done+' / '+total+'（'+pct+'%）</div>';
  el.innerHTML=html;
}
function renderTaskList(rec){
  if(!rec.tasks.length) return '<div class="empty">今日休息，好好放松 🌿</div>';
  let h='<ul class="tasks">';
  rec.tasks.forEach((tx,i)=>{ const done=isDone(rec,i);
    h+='<li><div class="chk '+(done?'done':'')+'" onclick="window.__toggle('+rec.day+','+i+')">'+(done?'✓':'')+'</div>'
     + '<div class="task-txt '+(done?'done':'')+'">'+escapeHtml(tx)+'</div></li>'; });
  h+='</ul>'; return h;
}
window.__toggle=function(day,i){ const rec=byDay[day]; if(!rec) return; toggle(rec,i,!isDone(rec,i)); };

/* ---------- 本周概览 ---------- */
function currentWeekNum(){ const rec=byDate[todayStr()]; if(rec) return rec.week; if(todayStr()<PLAN.startDate) return 1; return 12; }
function renderWeek(){
  const el=document.getElementById('weekCard');
  const num=currentWeekNum(); const w=PLAN.weeks[num]||{range:'',theme:'',goal:''};
  const {done,total}=weekDone(num); const pct=total?Math.round(done/total*100):0;
  let html='<h2>📅 本周概览 <span class="badge b-blue">第 '+num+' 周</span> <span class="meta" style="font-weight:400;color:var(--sub);font-size:13px">'+w.range+'</span></h2>';
  html+='<div class="today-head"><span class="wd" style="font-size:15px">'+w.theme+'</span></div>';
  html+='<div class="week-goal"><b>周目标：</b>'+escapeHtml(w.goal||'—')+'</div>';
  html+='<div class="progress"><i style="width:'+pct+'%"></i></div><div class="pct">本周完成 '+done+' / '+total+'（'+pct+'%）</div>';
  html+='<div class="week-days">';
  weekDays(num).forEach(r=>{ const d=dayDone(r),t=dayTotal(r),p=t?Math.round(d/t*100):0; const isT=r.date===todayStr();
    html+='<div class="wd-cell '+(isT?'today':'')+'" onclick="window.__openDay(\''+r.date+'\')">'
        + '<div class="ph" style="background:'+phaseColor(r)+'"></div>'
        + '<div class="d">'+parseDate(r.date).m+'/'+parseDate(r.date).d+'</div>'
        + '<div style="font-size:11px;color:var(--sub)">'+r.weekday+'</div>'
        + '<div class="mini"><i style="width:'+p+'%"></i></div></div>'; });
  html+='</div>'; el.innerHTML=html;
}

/* ---------- 日历（完整月历，空白天也显示） ---------- */
function renderCalendar(){
  const y=view.y, m=view.m;
  document.getElementById('monthLabel').textContent = y+'年'+m+'月';
  const first=new Date(y,m-1,1); let lead=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m,0).getDate();
  const cells=[]; for(let i=0;i<lead;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(pad(d));
  let html='';
  cells.forEach(c=>{
    if(c===null){ html+='<div class="cell blank"></div>'; return; }
    const ds=y+'-'+pad(m)+'-'+c; const rec=byDate[ds]; const isToday=ds===todayStr();
    if(!rec){ html+='<div class="cell blank"><div class="num">'+c+'</div></div>'; return; }
    const done=dayDone(rec), total=dayTotal(rec); const allDone=total>0&&done===total;
    const dim=(filterPhase!=='all'&&rec.phase!==filterPhase&&rec.type!=='考试'&&rec.type!=='休息')?' dim':'';
    const restTag=rec.type==='休息'?'<div class="rest">休息</div>':'';
    html+='<div class="cell '+(isToday?'today':'')+(allDone?' done':'')+dim+'" onclick="window.__openDay(\''+ds+'\')">'
        + '<div class="num">'+c+'</div>'
        + (rec.type==='考试'?'<div class="dot" style="background:var(--purple)"></div>':(rec.type==='休息'?'':('<div class="dot" style="background:'+phaseColor(rec)+'"></div>')))
        + restTag+'</div>';
  });
  document.getElementById('cal').innerHTML=html;
}

/* ---------- 弹窗 ---------- */
window.__openDay=function(ds){ const rec=byDate[ds]; if(!rec) return;
  const done=dayDone(rec),total=dayTotal(rec),pct=total?Math.round(done/total*100):0;
  let h='<div class="mhead"><span class="date">'+rec.date+'</span><span class="badge '+phaseClass(rec)+'">'+rec.phase+'</span>'
      + '<span class="badge b-gray">'+rec.type+'</span>'
      + '<button class="close" onclick="window.__closeModal()">×</button></div>';
  h+='<div class="mrow"><b>'+rec.weekday+'</b>　·　'+rec.week+'　·　科目：'+escapeHtml(rec.subject)+'　·　时长：'+escapeHtml(rec.duration)+'</div>';
  if(rec.resources&&rec.resources!=='—') h+='<div class="mrow">资源：'+escapeHtml(rec.resources)+'</div>';
  if(rec.goal&&rec.goal!=='—') h+='<div class="mrow">验收：'+escapeHtml(rec.goal)+'</div>';
  if(rec.note&&rec.note!=='—') h+='<div class="mrow">备注：'+escapeHtml(rec.note)+'</div>';
  h+='<hr>'+renderTaskList(rec);
  h+='<div class="progress"><i style="width:'+pct+'%"></i></div><div class="pct">已完成 '+done+' / '+total+'（'+pct+'%）</div>';
  document.getElementById('modal').innerHTML=h; document.getElementById('mask').classList.add('show');
};
window.__closeModal=function(){ document.getElementById('mask').classList.remove('show'); };
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') window.__closeModal(); });

/* ======== 每日一练 ======== */
function pickDailyQuestion(){
  const rec=byDate[todayStr()];
  const phase = rec ? rec.phase : null;
  let pool = phase===null ? Q : Q.filter(q=>q.phase===phase && rec.type!=='休息');
  if(!pool.length || rec.type==='休息') pool = Q;        // 休息日/窗口外 → 全库随机
  const wrong = pool.filter(q=>quizRecords[q.id]===0);    // 优先从错题本抽
  const use = wrong.length ? wrong : pool;
  return use[Math.floor(Math.random()*use.length)];
}
function renderDailyQuiz(){
  const el=document.getElementById('dailyQuiz');
  const q=pickDailyQuestion();
  const multi = q.type==='multi';
  let html='<h2>✍️ 每日一练 <span class="badge '+(multi?'b-orange':'b-blue')+'">'+(multi?'多选':'单选')+'</span></h2>';
  html+='<div class="q-meta"><span class="q-subject">'+q.phase+'　·　'+q.subject+'　·　'+q.chapter+'</span></div>';
  html+='<div class="q-body">'+escapeHtml(q.q)+'</div>';
  html+='<ul class="opts" id="dqOpts">';
  q.options.forEach((o,i)=>{ html+='<li data-i="'+i+'" onclick="window.__dqSel('+i+')"><span class="mark">'+(String.fromCharCode(65+i))+'</span><span class="txt">'+escapeHtml(o)+'</span></li>'; });
  html+='</ul>';
  html+='<div class="btn-row"><button class="btn" id="dqSubmit" onclick="window.__dqSubmit()">提交答案</button>'
      + '<button class="btn ghost" onclick="window.__dqNew()">换一题</button></div>';
  html+='<div class="q-result" id="dqResult"></div>';
  html+='<div class="q-explain" id="dqExplain"></div>';
  html+='<div class="btn-row" id="dqMore" style="display:none;margin-top:10px"><button class="btn green" onclick="window.__goReview()">✅ 继续练习（题库回顾）</button></div>';
  el.innerHTML=html; el._q=q; el._sel=[];
}
window.__dqSel=function(i){ const el=document.getElementById('dailyQuiz'); const q=el._q;
  if(el._answered) return;
  const li=document.querySelector('#dqOpts li[data-i="'+i+'"]');
  if(q.type==='multi'){ const idx=el._sel.indexOf(i); if(idx>=0) el._sel.splice(idx,1); else el._sel.push(i); li.classList.toggle('sel'); }
  else { el._sel=[i]; document.querySelectorAll('#dqOpts li').forEach(x=>x.classList.remove('sel')); li.classList.add('sel'); }
};
window.__dqSubmit=async function(){ const el=document.getElementById('dailyQuiz'); const q=el._q;
  if(el._answered) return; if(!el._sel.length){ alert('请先选择答案'); return; }
  const correct = JSON.stringify([...el._sel].sort((a,b)=>a-b))===JSON.stringify([...q.answer].sort((a,b)=>a-b));
  el._answered=true;
  document.querySelectorAll('#dqOpts li').forEach(li=>{ const i=+li.dataset.i;
    if(q.answer.includes(i)) li.classList.add('correct'); else if(el._sel.includes(i)) li.classList.add('wrong'); });
  const res=document.getElementById('dqResult'); res.className='q-result show '+(correct?'ok':'no');
  res.textContent = correct ? '🎉 答对了！' : ('❌ 答错了，正确答案：'+q.answer.map(i=>String.fromCharCode(65+i)).join(q.type==='multi'?'、':' '));
  const ex=document.getElementById('dqExplain'); ex.className='q-explain show';
  ex.innerHTML='<b>解析：</b>'+escapeHtml(q.explain);
  document.getElementById('dqSubmit').style.display='none';
  document.getElementById('dqMore').style.display='flex';
  const old=await saveQuiz(q.id, correct);
  // 每日一练愿力：每天限 1 次（+1）
  const dk='econ_dq_'+econDayKey();
  if(econDailyCount(dk) < 1){ econDailyInc(dk); econGrantWP(1,'经济师·每日一练','完成每日一练'); }
  // 错题攻克
  if(old===0 && correct) econConquerWrong(true);
};
window.__dqNew=function(){ document.getElementById('dailyQuiz')._answered=false; renderDailyQuiz(); };
window.__goReview=function(){ switchTab('review'); document.getElementById('revStart').click(); };

/* ======== 题库回顾 ======== */
function initReviewFilters(){
  const sel=document.getElementById('revSubject');
  SUBJECTS.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
}
function filteredQuestions(){
  const ph=document.getElementById('revPhase').value; const sj=document.getElementById('revSubject').value;
  return Q.filter(q=>(ph==='all'||q.phase===ph)&&(sj==='all'||q.subject===sj));
}
function renderReviewPrompt(){
  const pool=filteredQuestions();
  const done=pool.filter(q=>q.id in quizRecords).length;
  document.getElementById('revStat').innerHTML='当前筛选共 <b>'+pool.length+'</b> 题，已练 <b>'+done+'</b> 题';
  document.getElementById('reviewArea').innerHTML='<div class="empty">点击上方「开始练习」抽取一组逐题作答，或调整筛选条件。</div>';
}
function startReview(){
  const pool=filteredQuestions();
  if(!pool.length){ document.getElementById('reviewArea').innerHTML='<div class="empty">该筛选下没有题目。</div>'; return; }
  const n=Math.min(5, pool.length);
  const wrong=pool.filter(q=>quizRecords[q.id]===0);          // 错题优先录入
  const rest=pool.filter(q=>quizRecords[q.id]!==0);
  const pickedWrong=wrong.slice(0, n);
  const pickedRest=[...rest].sort(()=>Math.random()-0.5).slice(0, n-pickedWrong.length);
  const shuffled=[...pickedWrong, ...pickedRest].sort(()=>Math.random()-0.5);
  reviewSession={queue:shuffled, idx:0};
  renderReviewQuestion();
}
let reviewSession=null;
function renderReviewQuestion(){
  if(!reviewSession || reviewSession.idx>=reviewSession.queue.length){
    const total=reviewSession?reviewSession.queue.length:0;
    const ok=reviewSession?reviewSession.queue.filter(q=>quizRecords[q.id]===1).length:0;
    // 愿力：全对+2 / 对4题+1 / ≤3题0，每日限 3 组
    let gained=0; const dk='econ_rq_'+econDayKey();
    if(econDailyCount(dk) < 3){
      if(ok===total && total>0) gained=2; else if(ok>=4) gained=1;
      if(gained>0) econDailyInc(dk);
    }
    if(gained>0) econGrantWP(gained,'经济师·题库回顾','一组正确 '+ok+'/'+total);
    document.getElementById('reviewArea').innerHTML=
      '<div class="score-banner"><div class="big">'+ok+' / '+total+'</div><div>本组练习完成！正确率 '+Math.round(ok/total*100)+'%</div></div>'
      + (gained>0?'<div style="margin-top:8px;color:var(--green,#3f9c6d);font-weight:600">💡 +'+gained+' 愿力（经济师·题库回顾）</div>':'')
      + '<div class="btn-row"><button class="btn" onclick="window.__reviewAgain()">🔄 再来一组</button><button class="btn ghost" onclick="window.__reviewBack()">返回筛选</button></div>';
    return;
  }
  const q=reviewSession.queue[reviewSession.idx]; const multi=q.type==='multi';
  const card=document.getElementById('reviewArea');
  let html='<div class="q-meta"><span class="q-subject">第 '+(reviewSession.idx+1)+' / '+reviewSession.queue.length+' 题　·　'+(multi?'多选':'单选')+'　·　'+q.phase+'　·　'+q.subject+'</span></div>';
  html+='<div class="q-body">'+escapeHtml(q.q)+'</div>';
  html+='<ul class="opts" id="rqOpts">';
  q.options.forEach((o,i)=>{ html+='<li data-i="'+i+'" onclick="window.__rqSel('+i+')"><span class="mark">'+(String.fromCharCode(65+i))+'</span><span class="txt">'+escapeHtml(o)+'</span></li>'; });
  html+='</ul>';
  html+='<div class="btn-row"><button class="btn" id="rqSubmit" onclick="window.__rqSubmit()">提交</button>'
      + '<button class="btn ghost" onclick="window.__rqSkip()">跳过</button></div>';
  html+='<div class="q-result" id="rqResult"></div>';
  html+='<div class="q-explain" id="rqExplain"></div>';
  card.innerHTML=html; card._q=q; card._sel=[]; card._answered=false;
}
window.__rqSel=function(i){ const card=document.getElementById('reviewArea'); const q=card._q; if(card._answered) return;
  const li=document.querySelector('#rqOpts li[data-i="'+i+'"]');
  if(q.type==='multi'){ const idx=card._sel.indexOf(i); if(idx>=0) card._sel.splice(idx,1); else card._sel.push(i); li.classList.toggle('sel'); }
  else { card._sel=[i]; document.querySelectorAll('#rqOpts li').forEach(x=>x.classList.remove('sel')); li.classList.add('sel'); }
};
window.__rqSubmit=async function(){ const card=document.getElementById('reviewArea'); const q=card._q; if(card._answered) return; if(!card._sel.length){ alert('请先选择答案'); return; }
  const correct=JSON.stringify([...card._sel].sort((a,b)=>a-b))===JSON.stringify([...q.answer].sort((a,b)=>a-b));
  card._answered=true;
  document.querySelectorAll('#rqOpts li').forEach(li=>{ const i=+li.dataset.i; if(q.answer.includes(i)) li.classList.add('correct'); else if(card._sel.includes(i)) li.classList.add('wrong'); });
  const res=document.getElementById('rqResult'); res.className='q-result show '+(correct?'ok':'no');
  res.textContent=correct?'🎉 答对了！':'❌ 答错了，正确答案：'+q.answer.map(i=>String.fromCharCode(65+i)).join(q.type==='multi'?'、':' ');
  const ex=document.getElementById('rqExplain'); ex.className='q-explain show'; ex.innerHTML='<b>解析：</b>'+escapeHtml(q.explain);
  document.getElementById('rqSubmit').style.display='none';
  const old=await saveQuiz(q.id, correct);
  if(old===0 && correct) econConquerWrong(true);   // 原错题做对 → 攻克 +1
  // 看完解析再手动进下一题（不直接跳）
  const last = reviewSession.idx >= reviewSession.queue.length-1;
  const nb=document.createElement('button'); nb.className='btn green'; nb.style.marginTop='10px';
  nb.textContent = last ? '🏁 查看成绩' : '➡️ 下一题（看完原因再点）';
  nb.onclick=()=>{ reviewSession.idx++; renderReviewQuestion(); };
  card.appendChild(nb);
};
window.__rqSkip=function(){ reviewSession.idx++; renderReviewQuestion(); };
window.__reviewAgain=function(){ startReview(); };
window.__reviewBack=function(){ renderReviewPrompt(); };

function renderHist(){
  const el=document.getElementById('histArea');
  const ids=Object.keys(quizRecords);
  if(!ids.length){ el.innerHTML='<div class="empty">还没有答题记录，去「每日一练」或「开始练习」做几道吧。</div>'; return; }
  let h='';
  ids.slice().reverse().forEach(id=>{ const q=QBYID[id]; if(!q) return; const ok=quizRecords[id]===1;
    h+='<div class="hist-item" style="cursor:pointer" onclick="window.__showDetail(\''+id+'\')"><span class="'+(ok?'ok':'no')+'">'+(ok?'✓对':'✗错')+'</span>'
     + '<span class="qtext">'+escapeHtml(q.q)+'</span>'
     + '<span class="q-subject">'+q.subject+'</span></div>'; });
  el.innerHTML=h;
}

/* ---------- 错题本 ---------- */
function wrongIds(){ return Object.keys(quizRecords).filter(id=>quizRecords[id]===0); }
function renderWrong(){
  const ids=wrongIds();
  document.getElementById('wrongCount').textContent=ids.length+' 道待攻克';
  const el=document.getElementById('wrongArea');
  if(!ids.length){ el.innerHTML='<div class="empty">还没有错题。做错的题会自动收集到这里，方便你反复回顾。</div>'; return; }
  let h='';
  ids.forEach(id=>{ const q=QBYID[id]; if(!q) return;
    h+='<div class="hist-item" style="cursor:pointer" onclick="window.__showDetail(\''+id+'\')"><span class="no">✗错</span>'
     + '<span class="qtext">'+escapeHtml(q.q)+'</span>'
     + '<span class="q-subject">'+q.subject+'</span></div>'; });
  el.innerHTML=h;
}
function startWrong(){
  const ids=wrongIds(); if(!ids.length){ alert('错题本还是空的，先去做几道题吧～'); return; }
  const pool=ids.map(id=>QBYID[id]).filter(Boolean);
  const shuffled=[...pool].sort(()=>Math.random()-0.5);
  reviewSession={queue:shuffled, idx:0};
  switchTab('review');
  renderReviewQuestion();
}
function showQuestionDetail(id){
  const q=QBYID[id]; if(!q) return; const ok=quizRecords[id]===1; const seen=id in quizRecords;
  let h='<div class="mhead"><span class="date" style="font-size:17px">题目详情</span>'
    + '<span class="badge '+(q.type==='multi'?'b-orange':'b-blue')+'">'+(q.type==='multi'?'多选':'单选')+'</span>'
    + (seen?'<span class="badge '+(ok?'b-green':'b-red')+'">'+(ok?'已答对':'曾答错')+'</span>':'')
    + '<button class="close" onclick="window.__closeModal()">×</button></div>';
  h+='<div class="mrow"><b>'+q.phase+'　·　'+q.subject+'　·　'+q.chapter+'</b></div>';
  h+='<div class="q-body" style="margin-top:8px">'+escapeHtml(q.q)+'</div>';
  h+='<ul class="opts" style="pointer-events:none">';
  q.options.forEach((o,i)=>{ const corr=q.answer.includes(i);
    h+='<li class="'+(corr?'correct':'')+'"><span class="mark">'+(String.fromCharCode(65+i))+'</span><span class="txt">'+escapeHtml(o)+'</span></li>'; });
  h+='</ul>';
  h+='<div class="q-explain show" style="display:block"><b>解析：</b>'+escapeHtml(q.explain)+'</div>';
  document.getElementById('modal').innerHTML=h; document.getElementById('mask').classList.add('show');
}
window.__showDetail=function(id){ showQuestionDetail(id); };
window.__wrongClear=async function(){
  const ids=wrongIds(); if(!ids.length) return;
  ids.forEach(id=>delete quizRecords[id]);
  localStorage.setItem('econ_quiz_v1', JSON.stringify(quizRecords));
  if(storageMode==='db'){ try{ await fetch('/api/econ-quiz-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qids:ids})}); }catch(e){} }
  renderWrong();
};

/* ---------- 统计 ---------- */
function renderStats(){
  document.getElementById('rangeTxt').textContent=PLAN.startDate+' ~ '+PLAN.endDate;
  document.getElementById('totalDays').textContent=PLAN.totalDays;
  let done=0,total=0; PLAN.days.forEach(r=>{ total+=dayTotal(r); done+=dayDone(r); });
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('overallTxt').textContent=done+'/'+total+'（'+pct+'%）';
}

/* ---------- Tab 切换 ---------- */
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('on', p.id==='pane-'+name));
  if(name==='review'){ renderReviewPrompt(); renderHist(); }
  if(name==='quiz'){ renderDailyQuiz(); }
  if(name==='wrong'){ renderWrong(); }
}
document.querySelectorAll('.tabs button').forEach(b=> b.onclick=()=>switchTab(b.dataset.tab));

/* ---------- 事件 ---------- */
document.getElementById('prevM').onclick=()=>{ view.m--; if(view.m<1){view.m=12;view.y--;} renderCalendar(); };
document.getElementById('nextM').onclick=()=>{ view.m++; if(view.m>12){view.m=1;view.y++;} renderCalendar(); };
document.getElementById('jumpWeek').onclick=()=>{ const num=currentWeekNum(); const first=weekDays(num)[0]; if(first){ const p=parseDate(first.date); view={y:p.y,m:p.m,d:p.d}; renderCalendar(); } };
document.getElementById('filters').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; filterPhase=b.dataset.p;
  [...document.getElementById('filters').children].forEach(x=>x.classList.toggle('on',x===b)); renderCalendar(); });
document.getElementById('revStart').onclick=startReview;
document.getElementById('revReset').onclick=()=>{ document.getElementById('revPhase').value='all'; document.getElementById('revSubject').value='all'; renderReviewPrompt(); };
document.getElementById('revPhase').onchange=renderReviewPrompt;
document.getElementById('revSubject').onchange=renderReviewPrompt;
document.getElementById('wrongStart').onclick=startWrong;
document.getElementById('wrongClear').onclick=()=>window.__wrongClear();

/* ---------- 初始化 ---------- */
(async function init(){
  document.getElementById('rangeTxt').textContent=PLAN.startDate+' ~ '+PLAN.endDate;
  await loadData(); updateStorageBadge();
  renderStats(); renderToday(); renderWeek(); renderCalendar();
  initReviewFilters();
})();

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
