<!DOCTYPE html>
<html lang="zh-CN" data-theme="xuanzhi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光 · 人生修行</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="hamb" id="hambBtn" aria-label="打开菜单">☰</button>
  <div class="brand">🎮 拾光</div>
  <div class="resbar" id="resbar"></div>
  <div class="themes" id="themes">
    <button data-t="xuanzhi" class="on">宣纸</button>
    <button data-t="qingci">青瓷</button>
    <button data-t="mujin">暮金</button>
  </div>
</header>
<div class="nav-mask" id="navMask"></div>
<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="bagAddModal">
  <div class="modal-card">
    <div class="modal-title">➕ 添加物品到背包/仓库</div>
    <form class="form" id="bagAddForm">
      <label>名称</label>
      <input class="input" id="bagAddName" placeholder="如 鸡蛋 / 凉拌黄瓜">
      <label>类型</label>
      <select class="input" id="bagAddType">
        <option value="ingredient">🥬 食材</option>
        <option value="dish">🍲 料理</option>
        <option value="item">🔮 道具</option>
      </select>
      <label>数量</label>
      <input class="input" id="bagAddQty" type="number" min="1" value="1">
      <label>位置</label>
      <select class="input" id="bagAddLoc">
        <option value="bag">🎒 背包</option>
        <option value="warehouse">📦 仓库</option>
        <option value="fridge">🧊 冰箱区</option>
      </select>
    </form>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeBagAddModal()">取消</button>
      <button class="btn primary" onclick="saveBagAdd()">➕ 添加</button>
    </div>
  </div>
</div>
<div class="modal" id="confirmModal">
  <div class="modal-card">
    <div class="modal-title" id="confirmTitle">确认</div>
    <div class="modal-msg" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeConfirm()">取消</button>
      <button class="btn danger" id="confirmYes" onclick="onConfirmYes()">确定</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="loading" id="loading">正在连接修行数据…</div>
<script src="app.js"></script>
</body>
</html>
