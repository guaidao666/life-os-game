<!DOCTYPE html>
<html lang="zh-CN" data-theme="xuanzhi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏人生 · 独立站（方案C）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎮 游戏人生 <small>独立站 · 方案C 骨架</small></div>
  <div class="resbar" id="resbar"></div>
  <div class="themes" id="themes">
    <button data-t="xuanzhi" class="on">宣纸</button>
    <button data-t="qingci">青瓷</button>
    <button data-t="mujin">暮金</button>
  </div>
</header>
<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="cookModal">
  <div class="modal-card">
    <div class="modal-title" id="cookModalTitle">🍳 记录今天做的菜</div>
    <div class="form">
      <label>关联菜谱</label>
      <select class="input" id="cookRecipe"></select>
      <label>菜名</label>
      <input class="input" id="cookDish" placeholder="菜名，如 凉拌黄瓜">
      <label>评分</label>
      <div class="rate" id="cookRating">
        <button type="button" data-v="1" onclick="setCookRating(1)">★</button>
        <button type="button" data-v="2" onclick="setCookRating(2)">★</button>
        <button type="button" data-v="3" class="on" onclick="setCookRating(3)">★</button>
        <button type="button" data-v="4" onclick="setCookRating(4)">★</button>
        <button type="button" data-v="5" onclick="setCookRating(5)">★</button>
      </div>
      <label>感受（可选）</label>
      <input class="input" id="cookFeeling" placeholder="今天做这道菜的心情">
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeCookModal()">取消</button>
      <button class="btn primary" onclick="saveCookPost()">🍳 做菜并结算</button>
    </div>
  </div>
</div>
<div class="modal" id="bagAddModal">
  <div class="modal-card">
    <div class="modal-title">➕ 添加物品到背包/仓库</div>
    <form class="form" id="bagAddForm">
      <label>名称</label>
      <input class="input" id="bagAddName" placeholder="如 鸡蛋 / 凉拌黄瓜">
      <label>类型</label>
      <select class="input" id="bagAddType">
        <option value="ingredient">🥬 食材</option>
        <option value="dish">🍲 料理</option>
        <option value="item">🔮 道具</option>
      </select>
      <label>数量</label>
      <input class="input" id="bagAddQty" type="number" min="1" value="1">
      <label>位置</label>
      <select class="input" id="bagAddLoc">
        <option value="bag">🎒 背包</option>
        <option value="warehouse">📦 仓库</option>
        <option value="fridge">🧊 冰箱区</option>
      </select>
    </form>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeBagAddModal()">取消</button>
      <button class="btn primary" onclick="saveBagAdd()">➕ 添加</button>
    </div>
  </div>
</div>
<div class="modal" id="confirmModal">
  <div class="modal-card">
    <div class="modal-title" id="confirmTitle">确认</div>
    <div class="modal-msg" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeConfirm()">取消</button>
      <button class="btn danger" id="confirmYes" onclick="onConfirmYes()">确定</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<div class="loading" id="loading">正在连接修行数据…</div>
<script src="app.js"></script>
</body>
</html>
